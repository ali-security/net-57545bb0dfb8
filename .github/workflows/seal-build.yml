name: seal-build

# Upstream golang.org/x/net has no GitHub Actions CI (it is tested on Go's own
# LUCI builders). This workflow packs the module zip the way proxy.golang.org
# serves it and runs the module's own test suite (`go test ./...`) on
# Linux, macOS and Windows with the Go version go.mod declares (go 1.26.0).

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Go packages/flags to test instead of ./... (empty = full suite)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Build module zip helper (golang.org/x/mod/zip)
        run: |
          set -eux
          HELPER="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/createmod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .
      - name: Pack module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          # The seal workflow is not part of the module; keep it out of the zip.
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" golang.org/x/net v0.59.0 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.59.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.59.0.zip" | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.59.0.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Go version
        run: go version
      - name: Build
        run: |
          set -eux
          go build ./...
      - name: Test
        run: |
          set -euo pipefail
          go test -v ${{ inputs.test-filter || './...' }} 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: Test summary
        if: always()
        run: |
          set -eu
          awk '
            { sub(/\r$/, "") }
            /^ok[ \t]/ { okp++ }
            /^FAIL[ \t]/ { failp++ }
            /no test files/ { notest++ }
            /^[ \t]*--- PASS:/ { pass++ }
            /^[ \t]*--- FAIL:/ { fail++ }
            /^[ \t]*--- SKIP:/ { skip++ }
            END {
              printf "Packages ok: %d, packages FAIL: %d, packages with no test files: %d\n", okp, failp, notest
              printf "Tests passed: %d, tests failed: %d, tests skipped: %d\n", pass, fail, skip
            }
          ' "$RUNNER_TEMP/go-test.log"
      - name: Skipped tests with reasons
        if: always()
        run: |
          set -eu
          awk '
            { sub(/\r$/, "") }
            /^=== (RUN|CONT|NAME|PAUSE)[ \t]/ { cur = $3; next }
            /^[ \t]*--- SKIP:/ {
              name = $3
              r = (name in reason) ? reason[name] : "(no message)"
              printf "SKIPPED %s -- reason: %s\n", name, r
              byreason[r]++
              next
            }
            /^[ \t]+[A-Za-z0-9_.\-]+\.go:[0-9]+: / {
              if (cur != "" && !(cur in reason)) {
                msg = $0
                sub(/^[ \t]+[A-Za-z0-9_.\-]+\.go:[0-9]+: /, "", msg)
                reason[cur] = msg
              }
            }
            END {
              print "==== Skip count per reason ===="
              for (r in byreason) printf "%6d  %s\n", byreason[r], r
            }
          ' "$RUNNER_TEMP/go-test.log"
